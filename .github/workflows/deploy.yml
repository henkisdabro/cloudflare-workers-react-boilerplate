# .github/workflows/deploy.yml
name: Deploy to Cloudflare Workers

# This workflow runs on pushes to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      # Use Node.js 24 (Active LTS) to match local development
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build application
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        # Use the official Cloudflare Wrangler action
        uses: cloudflare/wrangler-action@v3
        with:
          # These secrets must be configured in the repository settings of the new project
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Skip the build step since we've already built above
          command: deploy --minify

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to ${DEPLOY_URL}"
